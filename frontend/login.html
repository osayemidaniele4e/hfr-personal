<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/login.styles.css" />
    <title>Document</title>
  </head>

  <body>
    <div class="container">
      <div class="wrapper">
        <div class="sidebar">
          <img src="/SideBar.svg" alt="Reset Password Illustration" />
        </div>

        <div class="form-container">
          <div>
            <img src="/new-logo.svg" alt="Logo" class="logo" />
          </div>

          <h1 class="heading">NIGERIA Health Facility Registry (HFR)</h1>
          <p class="subtitle">Login to Access your Dashboard</p>

          <form class="form">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                placeholder="Enter Email Address"
              />
            </div>

            <div class="form-group">
              <label for="new-password">Password</label>
              <input
                type="password"
                id="new-password"
                placeholder="Enter New Password"
              />
            </div>

            <a class="forgot-password" href="/forgotpassword">
              Forgot Password
            </a>

            <div>
              <button type="submit" class="submit-btn">Login</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
