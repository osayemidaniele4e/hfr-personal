name: Statistics
description: |-

  APIs for accessing aggregated statistics and analytics about healthcare facilities.
  Provides summary counts, breakdowns by ownership, facility level, and geographic distribution.
  Data is cached for 30 minutes to improve performance. No authentication required.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: statistics/tables
    metadata:
      custom: []
      groupName: Statistics
      groupDescription: |-

        APIs for accessing aggregated statistics and analytics about healthcare facilities.
        Provides summary counts, breakdowns by ownership, facility level, and geographic distribution.
        Data is cached for 30 minutes to improve performance. No authentication required.
      subgroup: ''
      subgroupDescription: ''
      title: 'Display National Statistics Dashboard'
      description: |-
        Shows comprehensive national-level statistics for all facility types (hospitals, laboratories,
        pharmacies, imaging centers). Includes breakdowns by ownership, facility level, and state.
        Data is cached for 30 minutes for optimal performance.
        This endpoint is publicly accessible without authentication.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "view": "public.statistics",
            "total_num_fac": [450, 180, 280, 120],
            "levels_by_state": [
              {
                "state": "FCT",
                "primary": 25,
                "secondary": 35,
                "tertiary": 15,
                "total": 75
              },
              {
                "state": "Lagos",
                "primary": 45,
                "secondary": 55,
                "tertiary": 25,
                "total": 125
              }
            ],
            "ownerships_by_state": [
              {
                "state": "FCT",
                "public": 50,
                "private": 20,
                "faith_based": 5,
                "total": 75
              }
            ],
            "levels_ownership_by_state": [
              {
                "state": "FCT",
                "public_primary": 15,
                "public_secondary": 25,
                "public_tertiary": 10,
                "private_primary": 10,
                "private_secondary": 10,
                "private_tertiary": 5
              }
            ],
            "lst_states": [
              {"id": 1, "name": "Abia"},
              {"id": 2, "name": "Adamawa"}
            ],
            "lst_facility_types": [
              {"id": 1, "name": "Hospital"},
              {"id": 2, "name": "Pharmacy"},
              {"id": 3, "name": "Laboratory"},
              {"id": 4, "name": "Imaging Center"}
            ]
          }
        headers: []
        description: Success
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - GET
    uri: statistics/tables/filter
    metadata:
      custom: []
      groupName: Statistics
      groupDescription: |-

        APIs for accessing aggregated statistics and analytics about healthcare facilities.
        Provides summary counts, breakdowns by ownership, facility level, and geographic distribution.
        Data is cached for 30 minutes to improve performance. No authentication required.
      subgroup: ''
      subgroupDescription: ''
      title: 'Get Filtered Statistics'
      description: |-
        Retrieves facility statistics filtered by state and facility type.
        Returns different data structures based on facility type:
        - Hospitals & Laboratories: Include level and ownership breakdowns
        - Pharmacies & Imaging Centers: Include ownership breakdowns only

        When state_id = 0 (all states), data is aggregated by state.
        When specific state is selected, data is broken down by LGA within that state.
        This endpoint is publicly accessible without authentication.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      state_id:
        custom: []
        name: state_id
        description: 'State ID. Use 0 for national/all states aggregation.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      facility_type_id:
        custom: []
        name: facility_type_id
        description: 'Facility type: 1 (Hospital), 2 (Pharmacy), 3 (Laboratory), 4 (Imaging Center).'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      state_id: 1
      facility_type_id: 1
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "view": "public.statistics_filtered",
            "total_num_fac": [450, 180, 280, 120],
            "levels_by_lga": [
              {
                "state": "FCT",
                "primary": 25,
