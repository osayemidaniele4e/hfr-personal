name: 'Statistics - Charts & Visualizations'
description: |-

  APIs for accessing chart-ready data and visualizations of healthcare facility statistics.
  Provides data formatted for chart libraries (pie charts, bar charts, etc.) including 
  facility distributions by ownership, level, and geographic location. Also includes 
  population-to-facility ratio analysis. Data is cached for performance. No authentication required.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: statistics/charts
    metadata:
      custom: []
      groupName: 'Statistics - Charts & Visualizations'
      groupDescription: |-

        APIs for accessing chart-ready data and visualizations of healthcare facility statistics.
        Provides data formatted for chart libraries (pie charts, bar charts, etc.) including 
        facility distributions by ownership, level, and geographic location. Also includes 
        population-to-facility ratio analysis. Data is cached for performance. No authentication required.
      subgroup: ''
      subgroupDescription: ''
      title: 'Display National Charts Dashboard'
      description: |-
        Returns chart-ready data for visualizing national hospital statistics including:
        - Distribution by facility level (pie/bar chart data)
        - Distribution by ownership type (pie/bar chart data)
        - Breakdown by state (table/bar chart data)

        Data is formatted with 'name' and 'y' fields for direct use in charting libraries like Highcharts.
        Results are cached for 30-60 minutes for optimal performance.
        This endpoint is publicly accessible without authentication.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "view": "public.statistic_charts",
            "facilities_level_state": [
              {"name": 1, "y": 150},
              {"name": 2, "y": 200},
              {"name": 3, "y": 100}
            ],
            "facilities_ownership_state": [
              {"name": 1, "y": 250},
              {"name": 2, "y": 180},
              {"name": 3, "y": 20}
            ],
            "levels_by_state": [
              {
                "state": "FCT",
                "primary": 25,
                "secondary": 35,
                "tertiary": 15,
                "total": 75
              },
              {
                "state": "Lagos",
                "primary": 45,
                "secondary": 55,
                "tertiary": 25,
                "total": 125
              }
            ],
            "lst_states": [
              {"id": 1, "name": "Abia"},
              {"id": 2, "name": "Adamawa"}
            ],
            "lst_facility_types": [
              {"id": 1, "name": "Hospital"},
              {"id": 2, "name": "Pharmacy"},
              {"id": 3, "name": "Laboratory"},
              {"id": 4, "name": "Imaging Center"}
            ],
            "facility_type_id": 1,
            "state_id": 0,
            "filtered": false
          }
        headers: []
        description: Success
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: statistics/charts/filter
    metadata:
