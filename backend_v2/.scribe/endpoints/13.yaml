  -
    custom: []
    httpMethods:
      - GET
    uri: statistics/populationindex
    metadata:
      custom: []
      groupName: 'Statistics - Charts & Visualizations'
      groupDescription: |-

        APIs for accessing chart-ready data and visualizations of healthcare facility statistics.
        Provides data formatted for chart libraries (pie charts, bar charts, etc.) including 
        facility distributions by ownership, level, and geographic location. Also includes 
        population-to-facility ratio analysis. Data is cached for performance. No authentication required.
      subgroup: ''
      subgroupDescription: ''
      title: 'Display Population Index Dashboard'
      description: |-
        Shows the population-to-facility ratio (people per facility) at national level,
        aggregated by state. Lower numbers indicate better facility coverage.
        Calculation: State Population ÷ Number of Hospitals in State = People per Facility

        Data is formatted as separate arrays for states and their corresponding ratios,
        ready for bar chart visualization. Cached for 60 minutes.
        This endpoint is publicly accessible without authentication.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "view": "public.statistic_population_index",
            "pop_index_states": [
              "Abia",
              "Adamawa",
              "FCT",
              "Lagos"
            ],
            "pop_index_ppf": [
              12500,
              15300,
              8200,
              11000
            ],
            "lst_states": [
              {"id": 1, "name": "Abia"},
              {"id": 2, "name": "Adamawa"}
            ],
            "state_id": 0
          }
        headers: []
        description: Success
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: statistics/populationindex/filter
    metadata:
      custom: []
      groupName: 'Statistics - Charts & Visualizations'
      groupDescription: |-

        APIs for accessing chart-ready data and visualizations of healthcare facility statistics.
        Provides data formatted for chart libraries (pie charts, bar charts, etc.) including 
        facility distributions by ownership, level, and geographic location. Also includes 
        population-to-facility ratio analysis. Data is cached for performance. No authentication required.
      subgroup: ''
      subgroupDescription: ''
      title: 'Get Filtered Population Index'
      description: |-
        Returns population-to-facility ratio filtered by state.
        - When state_id = 0: Shows ratio by state (national view)
        - When specific state selected: Shows ratio by LGA within that state

        The ratio indicates healthcare facility coverage - lower numbers mean
        better facility coverage per capita. For example, 10,000 means one facility
        serves 10,000 people on average.
        This endpoint is publicly accessible without authentication.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      state_id:
        custom: []
        name: state_id
        description: 'State ID. Use 0 for national state-level aggregation.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      state_id: 1
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "view": "public.statistic_population_index",
            "pop_index_states": [
              "Abia",
              "Adamawa",
              "FCT",
              "Lagos"
            ],
            "pop_index_ppf": [
              12500,
              15300,
              8200,
              11000
            ],
            "state_id": 0
          }
        headers: []
        description: 'National View (By State)'
      -
        custom: []
        status: 200
        content: |-
