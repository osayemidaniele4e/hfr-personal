name: 'FHIR - Location'
description: |-

  FHIR R4 Location endpoints. Each health facility's physical site is
  represented as a Location resource with GPS coordinates, address, and
  a reference to the managing Organization.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/fhir/Location
    metadata:
      custom: []
      groupName: 'FHIR - Location'
      groupDescription: |-

        FHIR R4 Location endpoints. Each health facility's physical site is
        represented as a Location resource with GPS coordinates, address, and
        a reference to the managing Organization.
      subgroup: ''
      subgroupDescription: ''
      title: 'Search Locations'
      description: 'Search across all facility locations. Supports geo-search via the `near` parameter.'
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      name:
        custom: []
        name: name
        description: 'Location name (partial match).'
        required: false
        example: 'General Hospital'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      identifier:
        custom: []
        name: identifier
        description: 'Facility code or registration number.'
        required: false
        example: RC/00001
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      status:
        custom: []
        name: status
        description: 'Location status (active, suspended, inactive).'
        required: false
        example: active
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      type:
        custom: []
        name: type
        description: 'Location type code (HOSP, MBL, PHARM, RADDX).'
        required: false
        example: HOSP
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      address:
        custom: []
        name: address
        description: 'Free text address search.'
        required: false
        example: 'Victoria Island'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      address-state:
        custom: []
        name: address-state
        description: 'State name.'
        required: false
        example: Lagos
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      organization:
        custom: []
        name: organization
        description: 'Managing organization reference.'
        required: false
        example: Organization/hosp-123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      near:
        custom: []
        name: near
        description: 'Geo-search: latitude|longitude|distance|units.'
        required: false
        example: 6.5244|3.3792|10|km
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      _count:
        custom: []
        name: _count
        description: 'Results per page (max 100).'
        required: false
        example: 20
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      _offset:
        custom: []
        name: _offset
        description: 'Pagination offset.'
        required: false
        example: 0
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      _sort:
        custom: []
        name: _sort
        description: 'Sort: name, -name, _lastUpdated, -_lastUpdated.'
        required: false
        example: name
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanQueryParameters:
      name: 'General Hospital'
      identifier: RC/00001
      status: active
      type: HOSP
      address: 'Victoria Island'
      address-state: Lagos
      organization: Organization/hosp-123
      near: 6.5244|3.3792|10|km
      _count: 20
      _offset: 0
      _sort: name
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 401
        content: '{"status":"error","message":"API key is required. Include your key in the X-API-Key header.","code":"MISSING_API_KEY"}'
        headers:
          cache-control: 'no-cache, private'
          content-type: application/json
          x-api-version: v1
          x-ratelimit-limit: '60'
          access-control-allow-origin: '*'
        description: null
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - GET
    uri: 'api/fhir/Location/{id}'
    metadata:
      custom: []
      groupName: 'FHIR - Location'
      groupDescription: |-

        FHIR R4 Location endpoints. Each health facility's physical site is
        represented as a Location resource with GPS coordinates, address, and
        a reference to the managing Organization.
      subgroup: ''
      subgroupDescription: ''
      title: 'Read Location'
      description: |-
        Retrieve a single Location by its FHIR resource ID.
        IDs are prefixed: loc-hosp-{id}, loc-lab-{id}, loc-pharm-{id}, loc-img-{id}.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      id:
        custom: []
        name: id
        description: 'The Location resource ID.'
        required: true
        example: loc-hosp-123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      id: loc-hosp-123
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 401
        content: '{"status":"error","message":"API key is required. Include your key in the X-API-Key header.","code":"MISSING_API_KEY"}'
        headers:
          cache-control: 'no-cache, private'
          content-type: application/json
          x-api-version: v1
          x-ratelimit-limit: '60'
          access-control-allow-origin: '*'
        description: null
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
