name: 'Facility Approval Tracking'
description: |-

  This controller manages the tracking and filtering of facility approval requests.
  It provides endpoints for viewing pending, validated, and published facility changes.

  These endpoints are primarily used by administrators and state-level officers
  to monitor the approval workflow of health facility data.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: admin/hospitals/approvals/approval-tracking
    metadata:
      custom: []
      groupName: 'Facility Approval Tracking'
      groupDescription: |-

        This controller manages the tracking and filtering of facility approval requests.
        It provides endpoints for viewing pending, validated, and published facility changes.

        These endpoints are primarily used by administrators and state-level officers
        to monitor the approval workflow of health facility data.
      subgroup: ''
      subgroupDescription: ''
      title: 'Display all pending facility approval requests.'
      description: |-
        Retrieves a list of facilities currently awaiting verification or approval.
        The results include facility details such as name, type, ownership, state, and status.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      none:
        custom: []
        name: none
        description: 'No parameters required.'
        required: false
        example: architecto
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      none: architecto
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
