        example: 0
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      _sort:
        custom: []
        name: _sort
        description: 'Sort: name, -name, _lastUpdated, -_lastUpdated.'
        required: false
        example: name
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanQueryParameters:
      name: 'General Hospital'
      'name:exact': 'General Hospital Lagos'
      'name:contains': General
      identifier: RC/00001
      type: hospital
      address-state: Lagos
      active: 'true'
      _count: 20
      _offset: 0
