openapi: 3.0.3
info:
  title: 'hfr API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Administration
    description: "\nHandles the dashboard views and related data for federal (national) and state-level users."
  -
    name: 'Administration - Contact'
    description: "\nAPIs for handling contact messages and feedback submissions.\n\nThis controller allows users to submit messages via a public contact form\nand allows admins to view submitted messages. Emails are sent to admins\nwith the feedback details."
  -
    name: 'Administration - DHIS2 Synchronization'
    description: "\nAPIs for synchronizing healthcare facility data with DHIS2 (District Health Information System).\nHandles creation, updates, and deletion of organization units in DHIS2, including assignment \nof ownership and level of care groups. All operations are logged for audit purposes."
  -
    name: 'Administration - Downloads'
    description: "\nAPIs for handling facility downloads and user registration for downloading datasets.\n\nThis controller manages public registration, token verification, dataset filtering, exporting, \nand admin download requests."
  -
    name: 'Administration - Equipment'
    description: "\nAPIs for managing laboratory equipment. Includes listing, creating, updating, and deleting equipment records."
  -
    name: 'Administration - Facility Reports'
    description: "\nAPIs for generating and exporting facility reports including updates, services, status, and approver summaries."
  -
    name: 'Administration - Hospitals'
    description: "\nAPIs for managing hospitals (create, read, update, delete, search, export)"
  -
    name: 'Administration - LGA Management'
    description: "\nAPIs for managing Local Government Areas (LGAs). Includes listing, creating, updating, deleting, and searching LGAs."
  -
    name: 'Administration - Laboratory'
    description: "\nEndpoints for listing, creating, updating, viewing, and searching laboratory facilities.\n\nNote:\n- Most methods return Blade views for the web UI.\n- Some endpoints return an HTML partial (e.g., show()).\n- API consumers should treat the responses as HTML unless explicitly JSON."
  -
    name: 'Administration - Laboratory Certification'
    description: "\nAPIs for managing laboratory certifications. Includes listing, creating, updating, and deleting certifications."
  -
    name: 'Administration - Master Data Hospital'
    description: "\nManage the master list of hospital services under service categories.\n\nThis controller handles listing, creating, updating, and deleting\nhospital service records."
  -
    name: 'Administration - Resources'
    description: "\nEndpoints for managing document resources.\nSupports upload, download, listing, updating, and deletion."
  -
    name: 'Administration - Roles'
    description: "\nHandles CRUD operations for roles and permission assignments."
  -
    name: 'Administration - State Management'
    description: "\nAPIs for managing states. Includes listing, creating, updating, and deleting states."
  -
    name: 'Administration - Users'
    description: "\nHandles CRUD operations, profile management, password changes, and permission assignments for users."
  -
    name: 'Administration - Ward Management'
    description: "\nAPIs for managing Wards. Includes listing, creating, updating, deleting, and searching wards."
  -
    name: 'Administration Imaging'
    description: "\nEndpoints for listing, creating, updating, deleting,\nviewing and searching imaging diagnostic facilities.\n\nNote:\n- Most endpoints return Blade views.\n- Some endpoints return HTML fragments.\n- JSON is returned only for exceptions and missing records."
  -
    name: 'Administration Pharmacy'
    description: "\nEndpoints for listing, creating, updating, viewing,\nand searching pharmacy facilities.\n\nNote:\n- Most endpoints return Blade views for the Web UI.\n- Some endpoints (e.g., show()) return HTML partials.\n- JSON is returned only for error responses."
  -
    name: Authentication
    description: "\nToken-based Login Flow\n\nThese endpoints handle the second step of a two-factor login flow.\nAfter submitting username/password, the system sends a token to the user\nand stores temporary login details in the session. The user must validate\nthe token here before being logged in."
  -
    name: Endpoints
    description: ''
  -
    name: 'FHIR - HealthcareService'
    description: "\nFHIR R4 HealthcareService endpoints. Services offered by hospital-type\nfacilities, sourced from the hs_hospital_services registry."
  -
    name: 'FHIR - Location'
    description: "\nFHIR R4 Location endpoints. Each health facility's physical site is\nrepresented as a Location resource with GPS coordinates, address, and\na reference to the managing Organization."
  -
    name: 'FHIR - Metadata'
    description: "\nFHIR CapabilityStatement endpoint (no authentication required)."
  -
    name: 'FHIR - Organization'
    description: "\nFHIR R4 Organization endpoints. Each health facility (hospital, laboratory,\npharmacy, imaging center) is represented as an Organization resource."
  -
    name: Facilities
    description: "\nEndpoints for searching and retrieving health facilities (hospitals & clinics)."
  -
    name: 'Facility Approval Tracking'
    description: "\nThis controller manages the tracking and filtering of facility approval requests.\nIt provides endpoints for viewing pending, validated, and published facility changes.\n\nThese endpoints are primarily used by administrators and state-level officers\nto monitor the approval workflow of health facility data."
  -
    name: 'Facility Approval Tracking - Facility Validation'
    description: "\nThis controller handles all validation-related workflows for health facility approval.\nIt allows authorized users to view pending validations, approve or reject facility requests,\nrecall validations, and track validation actions.\n\nAll actions are logged and tied to user permissions (State and LGA level)."
  -
    name: 'Facility Approval Tracking - Facility Verification'
    description: "\nThis controller handles all verification-related workflows for health facility approval.\nIt allows authorized users to view pending verification requests, approve or reject facility requests,\nrecall verifications, and track verification actions.\n\nAll actions are logged and tied to user permissions (State and LGA level)."
  -
    name: 'Facility Approval Tracking - My Requests'
    description: "\nThis controller manages all facility requests created by the currently logged-in user.\n\nIt allows users to:\n- View pending, approved, or rejected facility requests.\n- Edit or delete requests before they are verified.\n- Resubmit rejected delete requests.\n\nThese endpoints are mainly used in the **facility approval workflow**."
  -
    name: 'Facility Approval Tracking - Publication'
    description: "\nEndpoints for managing the publication process of health facility data.\n\nThese endpoints handle reviewing, approving, rejecting, and finalizing\nfacility publication requests, as well as syncing with DHIS2 where enabled."
  -
    name: 'Facility Approval Tracking - Record Updates'
    description: "\nEndpoints that provide detailed audit comparison between the current and updated\nrecords of a health facility. This helps reviewers and approvers understand what\nchanged in each facility record during the verification, validation, or publication stages."
  -
    name: 'Imaging Facilities'
    description: "\nEndpoints for searching and retrieving radiological / imaging premises."
  -
    name: Laboratories
    description: "\nEndpoints for searching and retrieving laboratory premises."
  -
    name: Lookups
    description: "\nReference data endpoints for states, LGAs, wards, facility types, ownership, and statuses."
  -
    name: Pharmacies
    description: "\nEndpoints for searching and retrieving pharmaceutical premises."
  -
    name: 'Public API (Frontend)'
    description: "\nPublic-facing API endpoints for the website.\n\nThese endpoints power the frontend app and provide public data such as\nsliders, process information, facility metadata, states, LGAs, wards,\nownership categories, and other lookup lists."
  -
    name: 'Public API (Frontend) - Facility Directory'
    description: "\nPublic-facing APIs for browsing and searching healthcare facilities including hospitals, \npharmacies, laboratories, and imaging centers. No authentication required."
  -
    name: 'Public API (Frontend) - Slider'
    description: "\nSome endpoints for slider\n\nThese endpoints powers crud for slider component"
  -
    name: Statistics
    description: "\nAPIs for accessing aggregated statistics and analytics about healthcare facilities.\nProvides summary counts, breakdowns by ownership, facility level, and geographic distribution.\nData is cached for 30 minutes to improve performance. No authentication required."
  -
    name: 'Statistics - Charts & Visualizations'
    description: "\nAPIs for accessing chart-ready data and visualizations of healthcare facility statistics.\nProvides data formatted for chart libraries (pie charts, bar charts, etc.) including \nfacility distributions by ownership, level, and geographic location. Also includes \npopulation-to-facility ratio analysis. Data is cached for performance. No authentication required."
paths:
  /administrator/completeness:
    post:
      summary: 'LGA Completeness Scores'
      operationId: lGACompletenessScores
      description: 'Returns completeness scores for all LGAs in a given state.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: Ikeja
                    'y':
                      type: integer
                      example: 85
                example:
                  -
                    name: Ikeja
                    'y': 85
                  -
                    name: Surulere
                    'y': 78
      tags:
        - Administration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  description: 'Name of the state.'
                  example: Lagos
                  nullable: false
              required:
                - state
  /administrator/facilitystatus:
    post:
      summary: 'LGA Facility Status'
      operationId: lGAFacilityStatus
      description: 'Returns facility status for all LGAs in a given state.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    lga:
                      type: string
                      example: Ikeja
                    status:
                      type: string
                      example: Active
                example:
                  -
                    lga: Ikeja
                    status: Active
                  -
                    lga: Surulere
                    status: Inactive
      tags:
        - Administration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  description: 'Name of the state.'
                  example: Lagos
                  nullable: false
              required:
                - state
  /admin/messages:
    get:
      summary: 'List all contact messages (admin view).'
      operationId: listAllContactMessagesadminView
      description: ''
      parameters:
        -
          in: query
          name: page
          description: 'The page number for pagination.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'The page number for pagination.'
            example: 1
            nullable: false
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Administration - Contact'
      security: []
  /admin/hfr-dhis-exchange/store:
    post:
      summary: 'Create Facility in DHIS2'
      operationId: createFacilityInDHIS2
      description: "Creates a new organization unit (facility) in DHIS2 with all associated metadata including\nownership, level of care, and optional level of care options. Automatically handles facility\nclosure date based on operational status. Sends email notification to DHIS2 team upon success.\nAll operations are logged to dhis_log table for audit trail."
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: string
                example: Created
        500:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'DHIS2 API Error'
                    type: string
                    example: Exception_Error
                  -
                    description: 'No Server Response'
                    type: string
                    example: Exception_Error
      tags:
        - 'Administration - DHIS2 Synchronization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: 'HFR facility ID (used as DHIS2 code).'
                  example: 12345
                  nullable: false
                facility_name:
                  type: string
                  description: 'Facility name.'
                  example: 'General Hospital Abuja'
                  nullable: false
                alt_facility_name:
                  type: string
                  description: 'Alternative/short facility name.'
                  example: 'Gen Hosp Abuja'
                  nullable: false
                state_id:
                  type: integer
                  description: 'State ID for parent organization unit lookup.'
                  example: 1
                  nullable: false
                ward_id:
                  type: integer
                  description: 'Ward ID for parent organization unit assignment.'
                  example: 50
                  nullable: false
                operational_status_id:
                  type: integer
                  description: 'Operational status: 1 (Operational), 2-4 (Temporarily closed - auto-sets close date), 5+ (Permanently closed - uses provided close date).'
                  example: 1
                  nullable: false
                ownership_id:
                  type: integer
                  description: 'Ownership type ID for group assignment.'
                  example: 1
                  nullable: false
                facility_level_id:
                  type: integer
                  description: 'Facility level/care level ID for group assignment.'
                  example: 3
                  nullable: false
                facility_level_option_id:
                  type: integer
                  description: 'Facility level option ID. Use 0 to skip.'
                  example: 0
                  nullable: false
                start_date:
                  type: date
                  description: 'Facility opening date.'
                  example: '2020-01-15'
                  nullable: false
                close_date:
                  type: date
                  description: 'Facility closure date (required if operational_status_id > 4).'
                  example: '2024-12-31'
                  nullable: false
                postal_address:
                  type: string
                  description: 'Postal address.'
                  example: 'P.O. Box 123, Abuja'
                  nullable: false
                longitude:
                  type: string
                  description: 'Longitude coordinate.'
                  example: '7.3986'
                  nullable: false
                latitude:
                  type: string
                  description: 'Latitude coordinate.'
                  example: '9.0765'
                  nullable: false
                email_address:
                  type: string
                  description: 'Email address.'
                  example: info@hospital.com
                  nullable: false
                website:
                  type: string
                  description: 'Website URL.'
                  example: 'https://hospital.com'
                  nullable: false
                phone_number:
                  type: string
                  description: 'Phone number.'
                  example: +234-123-456-7890
                  nullable: false
              required:
                - id
                - facility_name
                - state_id
                - ward_id
                - operational_status_id
                - ownership_id
                - facility_level_id
  /admin/hfr-dhis-exchange/update:
    post:
      summary: 'Update Facility in DHIS2'
      operationId: updateFacilityInDHIS2
      description: "Updates an existing organization unit (facility) in DHIS2. Supports updating basic facility\ninformation and reassigning organization unit groups (ownership, level of care, level options).\nOnly updates groups that are specified in the request data. Sends email notification to DHIS2\nteam upon success. All operations are logged."
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: string
                example: Updated
        500:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'DHIS2 API Error'
                    type: string
                    example: Exception_Error
                  -
                    description: 'Facility Not Found in DHIS2'
                    type: string
                    example: Exception_Error
                  -
                    description: 'Failed to Get DHIS2 UID'
                    type: string
                    example: Exception_Error
      tags:
        - 'Administration - DHIS2 Synchronization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: 'HFR facility ID.'
                  example: 12345
                  nullable: false
                data:
                  type: array
                  description: "Update data containing two keys:\n- updates: Object with facility fields to update (name, shortName, address, coordinates, etc.)\n- groups: Object with group assignments to update (ownership_id, facility_level_id, facility_level_option_id) or \"empty\" to skip"
                  example:
                    - architecto
                  items:
                    type: string
              required:
                - id
                - data
  /admin/hfr-dhis-exchange/delete:
    post:
      summary: 'Delete/Close Facility in DHIS2'
      operationId: deleteCloseFacilityInDHIS2
      description: "Attempts to delete a facility from DHIS2. If deletion fails due to associated data (DataValue),\nautomatically closes the facility instead by setting the closure date. Handles three scenarios:\n1. Successful deletion (no data associated)\n2. Closure (has associated data, cannot be deleted)\n3. Failure (other errors)\n\nSends appropriate email notifications to DHIS2 team. All operations are logged."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Successfully Deleted'
                    type: string
                    example: Deleted
                  -
                    description: 'Closed (Cannot Delete - Has Data)'
                    type: string
                    example: Closed
                  -
                    description: 'Deletion Failed'
                    type: string
                    example: 'Not Deleted'
                  -
                    description: 'Closure Failed'
                    type: string
                    example: 'Not Closed'
        500:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'DHIS2 API Error'
                    type: string
                    example: Exception_Error
                  -
                    description: 'Facility Not Found in DHIS2'
                    type: string
                    example: Exception_Error
      tags:
        - 'Administration - DHIS2 Synchronization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: 'HFR facility ID.'
                  example: 12345
                  nullable: false
                facility_name:
                  type: string
                  description: 'Facility name for email notification.'
                  example: 'General Hospital Abuja'
                  nullable: false
                alt_facility_name:
                  type: string
                  description: 'Alternative facility name.'
                  example: 'Gen Hosp Abuja'
                  nullable: false
                state_id:
                  type: integer
                  description: 'State ID.'
                  example: 1
                  nullable: false
                ward_id:
                  type: integer
                  description: 'Ward ID for email notification.'
                  example: 50
                  nullable: false
                start_date:
                  type: date
                  description: 'Facility opening date.'
                  example: '2020-01-15'
                  nullable: false
                postal_address:
                  type: string
                  description: 'Postal address.'
                  example: 'P.O. Box 123, Abuja'
                  nullable: false
                longitude:
                  type: string
                  description: 'Longitude coordinate.'
                  example: '7.3986'
                  nullable: false
                latitude:
                  type: string
                  description: 'Latitude coordinate.'
                  example: '9.0765'
                  nullable: false
                email_address:
                  type: string
                  description: 'Email address.'
                  example: info@hospital.com
                  nullable: false
                website:
                  type: string
                  description: 'Website URL.'
                  example: 'https://hospital.com'
                  nullable: false
                phone_number:
                  type: string
                  description: 'Phone number.'
                  example: +234-123-456-7890
                  nullable: false
              required:
                - id
                - facility_name
                - state_id
                - ward_id
  /admin/hfr-dhis-exchange/logs:
    get:
      summary: 'View DHIS2 Operation Logs'
      operationId: viewDHIS2OperationLogs
      description: "Displays a complete audit trail of all DHIS2 synchronization operations including\ncreates, updates, deletes, and group assignments. Shows status of each operation\nand any error details for troubleshooting."
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  view: dhis.logs
                  logs:
                    -
                      id: 1
                      hfr_id: 12345
                      dhis_uid: abcd1234efg
                      facility_status: Created
                      ownership_status: Success
                      level_status: Success
                      level_option_status: Success
                      error_details: ''
                      request_type: Create
                      user_id: 10
                      created_at: '2025-11-15 10:30:00'
                    -
                      id: 2
                      hfr_id: 12346
                      dhis_uid: null
                      facility_status: Failed
                      ownership_status: null
                      level_status: null
                      level_option_status: null
                      error_details: 'Connection timeout'
                      request_type: Create
                      user_id: 10
                      created_at: '2025-11-15 11:00:00'
                properties:
                  view:
                    type: string
                    example: dhis.logs
                  logs:
                    type: array
                    example:
                      -
                        id: 1
                        hfr_id: 12345
                        dhis_uid: abcd1234efg
                        facility_status: Created
                        ownership_status: Success
                        level_status: Success
                        level_option_status: Success
                        error_details: ''
                        request_type: Create
                        user_id: 10
                        created_at: '2025-11-15 10:30:00'
                      -
                        id: 2
                        hfr_id: 12346
                        dhis_uid: null
                        facility_status: Failed
                        ownership_status: null
                        level_status: null
                        level_option_status: null
                        error_details: 'Connection timeout'
                        request_type: Create
                        user_id: 10
                        created_at: '2025-11-15 11:00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        hfr_id:
                          type: integer
                          example: 12345
                        dhis_uid:
                          type: string
                          example: abcd1234efg
                        facility_status:
                          type: string
                          example: Created
                        ownership_status:
                          type: string
                          example: Success
                        level_status:
                          type: string
                          example: Success
                        level_option_status:
                          type: string
                          example: Success
                        error_details:
                          type: string
                          example: ''
                        request_type:
                          type: string
                          example: Create
                        user_id:
                          type: integer
                          example: 10
                        created_at:
                          type: string
                          example: '2025-11-15 10:30:00'
      tags:
        - 'Administration - DHIS2 Synchronization'
  /admin/hfr-dhis-exchange/lookup:
    get:
      summary: 'Display DHIS2 Lookup Table'
      operationId: displayDHIS2LookupTable
      description: "Shows the mapping/lookup table between HFR values and DHIS2 UIDs.\nUsed for translating HFR codes (ownership, levels, etc.) to DHIS2 organization unit groups.\nPaginated at 15 records per page."
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  view: dhis.lookup
                  lookup:
                    current_page: 1
                    data:
                      -
                        id: 1
                        type: ownership
                        hfr_id: 1
                        hfr_description: Public
                        dhis_uid: xyz123abc45
                        dhis_description: 'Public Ownership'
                        created_at: '2024-01-01 00:00:00'
                        updated_at: '2024-01-01 00:00:00'
                      -
                        id: 2
                        type: level
                        hfr_id: 1
                        hfr_description: Primary
                        dhis_uid: abc456def78
                        dhis_description: 'Primary Care'
                        created_at: '2024-01-01 00:00:00'
                        updated_at: '2024-01-01 00:00:00'
                    per_page: 15
                    total: 25
                properties:
                  view:
                    type: string
                    example: dhis.lookup
                  lookup:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      data:
                        type: array
                        example:
                          -
                            id: 1
                            type: ownership
                            hfr_id: 1
                            hfr_description: Public
                            dhis_uid: xyz123abc45
                            dhis_description: 'Public Ownership'
                            created_at: '2024-01-01 00:00:00'
                            updated_at: '2024-01-01 00:00:00'
                          -
                            id: 2
                            type: level
                            hfr_id: 1
                            hfr_description: Primary
                            dhis_uid: abc456def78
                            dhis_description: 'Primary Care'
                            created_at: '2024-01-01 00:00:00'
                            updated_at: '2024-01-01 00:00:00'
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            type:
                              type: string
                              example: ownership
                            hfr_id:
                              type: integer
                              example: 1
                            hfr_description:
                              type: string
                              example: Public
                            dhis_uid:
                              type: string
                              example: xyz123abc45
                            dhis_description:
                              type: string
                              example: 'Public Ownership'
                            created_at:
                              type: string
                              example: '2024-01-01 00:00:00'
                            updated_at:
                              type: string
                              example: '2024-01-01 00:00:00'
                      per_page:
                        type: integer
                        example: 15
                      total:
                        type: integer
                        example: 25
      tags:
        - 'Administration - DHIS2 Synchronization'
  /admin/hfr-dhis-exchange/lookup/store:
    post:
      summary: 'Create DHIS2 Lookup Entry'
      operationId: createDHIS2LookupEntry
      description: "Adds a new mapping between HFR values and DHIS2 UIDs.\nDHIS2 UID must be unique across all lookup entries."
      parameters: []
      responses:
        302:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Value added successfully!'
                  redirect: back
                properties:
                  message:
                    type: string
                    example: 'Value added successfully!'
                  redirect:
                    type: string
                    example: back
        422:
          description: 'Duplicate DHIS UID'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The dhis uid has already been taken.'
                  errors:
                    dhis_uid:
                      - 'The dhis uid has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The dhis uid has already been taken.'
                  errors:
                    type: object
                    properties:
                      dhis_uid:
                        type: array
                        example:
                          - 'The dhis uid has already been taken.'
                        items:
                          type: string
      tags:
        - 'Administration - DHIS2 Synchronization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dhis_uid:
                  type: string
