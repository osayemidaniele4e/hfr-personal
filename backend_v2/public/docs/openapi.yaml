      operationId: searchDHIS2LookupEntries
      description: "Filters lookup table by type and HFR description.\nUseful for finding specific mappings during configuration or troubleshooting.\nResults are paginated at 15 per page."
      parameters: []
      responses:
        200:
          description: ''
