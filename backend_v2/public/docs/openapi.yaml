  /admin/hfr-dhis-exchange/resend:
    post:
      summary: 'Retry Failed DHIS2 Operations'
      operationId: retryFailedDHIS2Operations
      description: "Attempts to retry previously failed DHIS2 operations (create, update, or group assignments).\nRetrieves facility data from database and reattempts the failed operation based on the log entry.\nUseful for handling temporary network issues or DHIS2 server downtime."
      parameters: []
      responses:
        302:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Facility Created Successfully'
                    type: object
                    example:
                      message: 'Facility created successfully!'
                      redirect: back
                    properties:
                      message:
                        type: string
                        example: 'Facility created successfully!'
                      redirect:
                        type: string
                        example: back
                  -
                    description: 'Facility Updated Successfully'
                    type: object
                    example:
                      message: 'Facility updated successfully!'
                      redirect: back
                    properties:
                      message:
                        type: string
                        example: 'Facility updated successfully!'
                      redirect:
                        type: string
                        example: back
                  -
                    description: 'Ownership Group Assigned'
                    type: object
                    example:
                      message: 'Facility ownership group assigned successfully!'
                      redirect: back
                    properties:
                      message:
                        type: string
                        example: 'Facility ownership group assigned successfully!'
                      redirect:
                        type: string
                        example: back
                  -
                    description: 'Level of Care Group Assigned'
                    type: object
                    example:
                      message: 'Facility level of care group assigned successfully!'
                      redirect: back
                    properties:
                      message:
                        type: string
                        example: 'Facility level of care group assigned successfully!'
                      redirect:
                        type: string
                        example: back
                  -
                    description: 'Ownership Assignment Failed'
                    type: object
                    example:
                      message: 'Failed to assign facility ownership group'
                      redirect: back
                    properties:
                      message:
                        type: string
                        example: 'Failed to assign facility ownership group'
                      redirect:
                        type: string
                        example: back
                  -
                    description: 'DHIS2 API Error'
                    type: object
                    example:
                      message: 'Error creating facility in DHIS2!'
                      redirect: back
                    properties:
                      message:
                        type: string
                        example: 'Error creating facility in DHIS2!'
                      redirect:
                        type: string
                        example: back
                  -
                    description: 'Facility Not Found in DHIS2'
                    type: object
                    example:
                      message: 'Failed to get matching facility in DHIS2!'
                      redirect: back
                    properties:
                      message:
                        type: string
                        example: 'Failed to get matching facility in DHIS2!'
                      redirect:
                        type: string
                        example: back
      tags:
        - 'Administration - DHIS2 Synchronization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                log_id:
                  type: integer
                  description: 'ID of the failed log entry to retry.'
                  example: 456
                  nullable: false
                facility_id:
                  type: integer
                  description: 'HFR facility ID.'
                  example: 12345
                  nullable: false
                facility_status:
                  type: string
                  description: 'Status of facility operation: "Failed" to retry facility creation/update.'
                  example: Failed
                  nullable: false
                ownership_status:
                  type: string
                  description: 'Status of ownership assignment: "Failed" to retry ownership group assignment.'
                  example: Success
                  nullable: false
                level_status:
                  type: string
                  description: 'Status of level assignment: "Failed" to retry level of care group assignment.'
                  example: Success
                  nullable: false
                level_option_status:
                  type: string
                  description: 'Status of level option assignment: "Failed" to retry level option group assignment.'
                  example: Failed
                  nullable: false
                request_type:
                  type: string
                  description: 'Original request type: "Create" or "Update".'
                  example: Create
                  nullable: false
                dhis_uid:
                  type: string
                  description: 'DHIS2 facility UID (required for group assignment retries).'
                  example: abcd1234efg
                  nullable: false
              required:
                - log_id
                - facility_id
