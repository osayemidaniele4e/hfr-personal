                      view: dhis.lookup
                      lookup:
                        current_page: 1
                        data:
                          -
                            id: 1
                            type: ownership
                            hfr_id: 1
                            hfr_description: Public
                            dhis_uid: xyz123abc45
                            dhis_description: 'Public Ownership'
                        per_page: 15
                        total: 1
                    properties:
                      view:
                        type: string
                        example: dhis.lookup
                      lookup:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          data:
                            type: array
                            example:
                              -
                                id: 1
                                type: ownership
                                hfr_id: 1
                                hfr_description: Public
                                dhis_uid: xyz123abc45
                                dhis_description: 'Public Ownership'
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                type:
                                  type: string
                                  example: ownership
                                hfr_id:
                                  type: integer
                                  example: 1
                                hfr_description:
                                  type: string
                                  example: Public
                                dhis_uid:
                                  type: string
                                  example: xyz123abc45
                                dhis_description:
                                  type: string
                                  example: 'Public Ownership'
                          per_page:
                            type: integer
                            example: 15
                          total:
                            type: integer
                            example: 1
                  -
                    description: 'No Results'
                    type: object
                    example:
                      lookup:
                        data: []
                        total: 0
                    properties:
                      lookup:
                        type: object
                        properties:
                          data:
                            type: array
                            example: []
                          total:
                            type: integer
                            example: 0
