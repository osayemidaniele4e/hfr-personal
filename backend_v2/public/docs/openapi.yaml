  /statistics/populationindex:
    get:
      summary: 'Display Population Index Dashboard'
      operationId: displayPopulationIndexDashboard
      description: "Shows the population-to-facility ratio (people per facility) at national level,\naggregated by state. Lower numbers indicate better facility coverage.\nCalculation: State Population ÷ Number of Hospitals in State = People per Facility\n\nData is formatted as separate arrays for states and their corresponding ratios,\nready for bar chart visualization. Cached for 60 minutes.\nThis endpoint is publicly accessible without authentication."
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  view: public.statistic_population_index
                  pop_index_states:
                    - Abia
                    - Adamawa
                    - FCT
                    - Lagos
                  pop_index_ppf:
                    - 12500
                    - 15300
                    - 8200
                    - 11000
                  lst_states:
                    -
                      id: 1
                      name: Abia
                    -
                      id: 2
                      name: Adamawa
                  state_id: 0
                properties:
                  view:
                    type: string
                    example: public.statistic_population_index
                  pop_index_states:
                    type: array
                    example:
                      - Abia
                      - Adamawa
                      - FCT
                      - Lagos
                    items:
                      type: string
                  pop_index_ppf:
                    type: array
                    example:
                      - 12500
                      - 15300
                      - 8200
                      - 11000
                    items:
                      type: integer
                  lst_states:
                    type: array
                    example:
                      -
                        id: 1
                        name: Abia
                      -
                        id: 2
                        name: Adamawa
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Abia
                  state_id:
                    type: integer
                    example: 0
      tags:
        - 'Statistics - Charts & Visualizations'
      security: []
