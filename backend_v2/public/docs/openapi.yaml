  /login/token:
    get:
      summary: 'Display the token verification page.'
      operationId: displayTheTokenVerificationPage
      description: "This endpoint shows the token entry screen to the user, but only if a\ntoken has been generated and stored in the session during the login flow.\n\nIf no token exists in the current session, the user is redirected to `/`."
      parameters: []
      responses:
        302:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "<!DOCTYPE html>\n<html>\n    <head>\n        <meta charset=\"UTF-8\" />\n        <meta http-equiv=\"refresh\" content=\"0;url='http://localhost'\" />\n\n        <title>Redirecting to http://localhost</title>\n    </head>\n    <body>\n        Redirecting to <a href=\"http://localhost\">http://localhost</a>.\n    </body>\n</html>"
      tags:
        - Authentication
      security: []
    post:
      summary: 'Verify the submitted token and complete login.'
      operationId: verifyTheSubmittedTokenAndCompleteLogin
      description: "Validates the token submitted by the user against the token stored in the session.\nIf the token has expired, or does not match, the user is redirected back with an error.\n\nUpon successful validation, the system logs the user in using the stored user ID\nand clears the token session data, then redirects to `/administrator`."
      parameters: []
      responses:
        302:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: ''
                    type: object
                    example:
                      redirect: /administrator
                    properties:
                      redirect:
                        type: string
                        example: /administrator
                  -
                    description: ''
                    type: object
                    example:
                      error: 'Invalid token or token expired'
                    properties:
                      error:
                        type: string
                        example: 'Invalid token or token expired'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'The token sent to the user.'
                  example: architecto
                  nullable: false
              required:
                - token
      security: []
