# Same as render.yaml but rootDir values are for a monorepo whose Git root is the parent of `hfr/`.
# Render: New → Blueprint → Blueprint path: hfr/render.monorepo.yaml

services:
  - type: web
    runtime: node
    name: hfr-frontend
    rootDir: hfr/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_BACKEND_API
        value: https://hfr-backend.onrender.com/api
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://hfr-backend.onrender.com/
      - key: NEXT_PUBLIC_GOOGLE_MAP_API
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://hfr-frontend.onrender.com

  - type: web
    runtime: docker
    name: hfr-backend
    rootDir: hfr/backend_v2
    preDeployCommand: php artisan migrate --force
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: Laravel
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://hfr-backend.onrender.com
      - key: FRONTEND_URL
        value: https://hfr-frontend.onrender.com
      - key: APP_KEY
        sync: false
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
